# Exemple de déploiement. Copier en docker-compose.yml et adapter les chemins.
#
# Un seul montage /data partagé avec qBittorrent (téléchargements ET bibliothèque dessous),
# sinon les hardlinks sont impossibles et l'import retombe en copie.
services:
  bigarr:
    image: ghcr.io/hezflix/bigarr:edge
    container_name: bigarr
    # L'image tourne sans root (uid 1654). Aligner sur le propriétaire de /config et /data.
    user: "1000:1000"
    ports:
      - "7979:7979"
    environment:
      - TZ=Europe/Paris
      # Mot de passe admin du premier démarrage. Sans cette variable, un mot de passe est généré et affiché dans les logs.
      # - Bigarr__InitialAdminPassword=change-me
    volumes:
      - ./config:/config
      - /srv/data:/data
    restart: unless-stopped
