# Deployment example. Copy to docker-compose.yml and adapt the paths.
#
# Keep ONE /data mount shared with qBittorrent (downloads AND libraries below it):
# hardlinks are impossible across mounts and imports would fall back to copies.
# qBittorrent itself is configured in the UI (Settings → Download clients): host, port,
# WebUI credentials and the category Bigarr owns. Use its internal Docker name as host.
services:
  bigarr:
    image: ghcr.io/hezflix/bigarr:edge
    container_name: bigarr
    # The image runs rootless (uid 1654). Match the owner of /config and /data.
    user: "1000:1000"
    ports:
      - "7979:7979"
    environment:
      - TZ=Europe/Paris
      # TMDB v3 API key or v4 read access token (free). Without it the embedded fixture catalogue is used.
      - Bigarr__Tmdb__ApiKey=
      # TVDB v4 project API key: series episode numbering (TMDB alone numbers them otherwise).
      - Bigarr__Tvdb__ApiKey=
      # Indexers come from Prowlarr: add Bigarr there as a Radarr application (Settings → Apps), see the README.
      # Admin password on first start. Without it a password is generated and printed once in the logs.
      # - Bigarr__InitialAdminPassword=change-me
    volumes:
      - ./config:/config
      - /srv/data:/data
    restart: unless-stopped
