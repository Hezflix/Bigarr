name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version

      # One bun for CI and for the image: web/.bun-version and the Dockerfile's bun image move together.
      - name: Pinned versions agree
        run: |
          bun_file=$(tr -d '[:space:]' < web/.bun-version)
          bun_image=$(sed -n 's|^FROM .*oven/bun:\([0-9.]*\)-alpine.*|\1|p' Dockerfile)
          echo "bun: file $bun_file, image $bun_image"
          test -n "$bun_file" && test "$bun_file" = "$bun_image"

      - name: Build front
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build
          bun run test

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ffprobe reads media info from imported files; the reader tests probe a clip rendered by ffmpeg.
      # Ubuntu's mirror can stall or be unreachable: give it a few minutes, then take a static build from
      # GitHub. The tests that need ffmpeg skip themselves without it, so a failure here never blocks the build.
      - name: Install ffmpeg
        timeout-minutes: 8
        continue-on-error: true
        run: |
          if sudo timeout 150 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -q \
            && sudo timeout 180 apt-get install -y -q --no-install-recommends ffmpeg; then
            exit 0
          fi
          echo "::warning::Ubuntu's mirror did not answer, using a static ffmpeg build"
          # A dated build of a release branch, checked: the month-end builds are kept two years (until late 2028).
          ffmpeg_build=ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1
          ffmpeg_sha256=41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
          curl -fsSL --retry 3 --max-time 180 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/$ffmpeg_build.tar.xz"
          echo "$ffmpeg_sha256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJ -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/ffmpeg.tar.xz"
          echo "$RUNNER_TEMP/$ffmpeg_build/bin" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # The build wrote the OpenAPI document: the committed TypeScript types must be the ones it produces.
      - name: API types are current
        working-directory: web
        run: |
          bun run gen:api
          git diff --exit-code -- src/api/generated

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  # Every merge to main is a release: the version comes from the commits since the last v* tag
  # (.github/scripts/next-version.sh), the image is published as X.Y.Z, X.Y, edge and sha-*, then the tag and a
  # GitHub release are created. One run at a time, so two quick merges never compute the same version.
  docker:
    name: Docker image (multi-arch)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Next version
        run: |
          version=$(.github/scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "Release: ${version:-none}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bigarr
          tags: |
            type=edge,branch=main
            type=sha
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.version != '' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The release reports its version (System → Status).
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After the image, so a tag always has its image.
      - name: Tag and release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
