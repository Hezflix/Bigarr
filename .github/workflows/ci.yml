name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build front
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ffprobe reads media info from imported files; the reader tests probe a clip rendered by ffmpeg.
      # Ubuntu's mirror can stall or be unreachable: give it a few minutes, then take a static build from
      # GitHub. The tests that need ffmpeg skip themselves without it, so a failure here never blocks the build.
      - name: Install ffmpeg
        timeout-minutes: 8
        continue-on-error: true
        run: |
          if sudo timeout 150 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -q \
            && sudo timeout 180 apt-get install -y -q --no-install-recommends ffmpeg; then
            exit 0
          fi
          echo "::warning::Ubuntu's mirror did not answer, using a static ffmpeg build"
          curl -fsSL --retry 3 --max-time 180 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  docker:
    name: Docker image (multi-arch)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bigarr
          tags: |
            type=edge,branch=main
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
